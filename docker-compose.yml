services:
  # ── API Gateway (Phase 4) ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aegix_net

  # ── Frontend Server ──
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    environment:
      - VITE_API_URL=http://localhost/api
    networks:
      - aegix_net

  # ── Backend Server ──
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_LOG_LEVEL=info
      - FRONTEND_ORIGINS=http://localhost
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://aegix:secret@postgres:5432/aegix?sslmode=disable
      - JWT_SECRET=super-secret-aegix-jwt-key
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - aegix_net

  # ── Hot Storage ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - aegix_net

  # ── Cold Storage ──
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=aegix
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=aegix
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegix -d aegix"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - aegix_net

volumes:
  pg_data:

networks:
  aegix_net:
    driver: bridge
