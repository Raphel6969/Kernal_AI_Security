run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - bodyclose
    - gocritic
    - revive

linters-settings:
  govet:
    check-shadowing: true
  revive:
    rules:
      - name: exported
        severity: warning

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
        - gocritic
    - path: "cmd/"
      linters:
        - gocritic
